<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doba.objects — Modern Jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #1c1c1c;
      --muted: #6b6b6b;
      --accent: #bfa268;
      --border: #e8e4df;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --radius: 0.5rem;
      --max-width: 72rem;
      --header-height: 6rem;
      --font-body: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Montserrat', Georgia, 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: 90%;
      max-width: var(--max-width);
      margin-inline: auto;
    }

    .section {
      padding: 4rem 0;
    }

    .section__title {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section__intro {
      color: var(--muted);
      max-width: 55ch;
      margin-bottom: 2.5rem;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: rgba(250, 249, 247, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      height: 100%;
      flex: 1;
      min-width: 0;
    }

    .logo img {
      height: calc(var(--header-height) - 1rem);
      width: auto;
      max-width: min(78vw, 420px);
      object-fit: contain;
      object-position: left center;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 101;
      flex-shrink: 0;
    }

    .menu-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--text);
      transition: transform 0.25s ease, opacity 0.25s ease;
      transform-origin: center;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .nav {
      position: fixed;
      inset: var(--header-height) 0 0 0;
      background: rgba(250, 249, 247, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 99;
    }

    .nav.is-open {
      transform: translateX(0);
    }

    .nav a {
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }

    .nav a:hover,
    .nav a.is-active {
      color: var(--accent);
    }

    .nav__divider {
      width: 2rem;
      height: 1px;
      background: var(--border);
      margin: 0.25rem 0;
    }

    /* Pages */
    main {
      flex: 1;
    }

    .page {
      display: none;
    }

    .page.is-active {
      display: block;
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: calc(100svh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero__bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(250, 249, 247, 0.35);
      pointer-events: none;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: var(--max-width);
      padding: 2rem 0;
    }

    .hero__title {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 10vw, 5.5rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .hero__tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 400;
      color: var(--text);
      max-width: 40ch;
      margin: 0 auto 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.85rem 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--surface);
      transition: background 0.2s ease, color 0.2s ease;
      cursor: pointer;
    }

    .btn:hover,
    .btn:focus {
      background: transparent;
      color: var(--text);
    }

    .btn--ghost {
      background: transparent;
      color: var(--text);
    }

    .btn--ghost:hover,
    .btn--ghost:focus {
      background: var(--text);
      color: var(--surface);
    }

    /* Carousel */
    .carousel {
      position: relative;
      overflow: hidden;
    }

    .carousel__track {
      display: flex;
      height: 100%;
      transition: transform 0.4s ease;
    }

    .carousel__slide {
      min-width: 100%;
      display: block;
      flex-shrink: 0;
    }

    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--text);
      cursor: pointer;
      z-index: 2;
    }

    .carousel__btn--prev {
      left: 0.5rem;
    }

    .carousel__btn--next {
      right: 0.5rem;
    }

    .carousel__dots {
      position: absolute;
      bottom: 0.6rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.4rem;
      z-index: 2;
    }

    .carousel__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.25);
      cursor: pointer;
      padding: 0;
    }

    .carousel__dot.is-active {
      background: var(--text);
    }

    /* About */
    .about__grid {
      display: grid;
      gap: 2.5rem;
      align-items: center;
    }

    .about__image {
      aspect-ratio: 4 / 5;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .about__image.carousel {
      display: block;
    }

    .about__image .carousel__track {
      height: 100%;
    }

    .about__image .carousel__slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about__text h2 {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .about__text p {
      color: var(--muted);
      margin-bottom: 1rem;
    }

    @media (min-width: 768px) {
      .about__grid {
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
      }
    }

    /* Collection page */
    .page-header {
      padding: 3.5rem 0 1rem;
    }

    .page-header__title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .page-header__desc {
      color: var(--muted);
      max-width: 60ch;
      margin-bottom: 0.5rem;
    }

    .breadcrumb {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .breadcrumb a:hover {
      color: var(--text);
    }

    .collections-preview {
      padding-bottom: 4rem;
    }

    .collections-preview__grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .collections-preview__grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }

    .preview-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    .preview-card__media {
      aspect-ratio: 1 / 1;
      background: #f0ede8;
      overflow: hidden;
    }

    .preview-card__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .preview-card:hover .preview-card__media img {
      transform: scale(1.03);
    }

    .preview-card__body {
      padding: 1.25rem;
    }

    .preview-card__title {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .preview-card__meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1fr;
      padding-bottom: 4rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    .card.is-open {
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    .card__media {
      aspect-ratio: 1 / 1;
      background: #f0ede8;
      overflow: hidden;
    }

    .card__media.carousel {
      display: block;
    }

    .card__media .carousel__track {
      height: 100%;
    }

    .card__media .carousel__slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card__body {
      padding: 1.25rem;
    }

    .card__title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .card__meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card__info {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }

    .card.is-open .card__info {
      max-height: 12rem;
      opacity: 1;
      margin-top: 0.85rem;
    }

    .card__info p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
      border-top: 1px solid var(--border);
      padding-top: 0.85rem;
    }

    .card__hint {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .card.is-open .card__hint {
      display: none;
    }

    /* Contact page */
    .contact-page {
      min-height: calc(100svh - var(--header-height) - 8rem);
      display: flex;
      align-items: center;
      text-align: center;
      padding: 4rem 0;
    }

    .contact-page .section__intro {
      margin-inline: auto;
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 0;
      text-align: center;
      margin-top: auto;
    }

    .footer__brand {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .footer__copy {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="#home" class="logo" data-link>
        <img src="Untitled.svg" alt="doba.objects logo">
      </a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-link>Home</a>
      <div class="nav__divider" aria-hidden="tr
