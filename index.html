<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doba.objects — Modern Jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #1c1c1c;
      --muted: #6b6b6b;
      --accent: #bfa268;
      --border: #e8e4df;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --radius: 0.5rem;
      --max-width: 72rem;
      --header-height: 6rem;
      --font-body: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Montserrat', Georgia, 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: 90%;
      max-width: var(--max-width);
      margin-inline: auto;
    }

    .section {
      padding: 4rem 0;
    }

    .section__title {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section__intro {
      color: var(--muted);
      max-width: 55ch;
      margin-bottom: 2.5rem;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: rgba(250, 249, 247, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      height: 100%;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .logo img {
      height: calc(var(--header-height) - 1rem);
      width: auto;
      max-width: min(78vw, 420px);
      object-fit: contain;
      object-position: left center;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 101;
      flex-shrink: 0;
    }

    .menu-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--text);
      transition: transform 0.25s ease, opacity 0.25s ease;
      transform-origin: center;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .nav {
      position: fixed;
      inset: var(--header-height) 0 0 0;
      background: rgba(250, 249, 247, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 99;
    }

    .nav.is-open {
      transform: translateX(0);
    }

    .nav a {
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .nav a:hover,
    .nav a.is-active {
      color: var(--accent);
    }

    .nav__divider {
      width: 2rem;
      height: 1px;
      background: var(--border);
      margin: 0.25rem 0;
    }

    main {
      flex: 1;
    }

    /* Pages: only the active page is shown */
    .page {
      display: none;
    }

    .page.is-active {
      display: block;
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: calc(100svh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

      position: absolute;
      inset: 0;
